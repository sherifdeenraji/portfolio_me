<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0dc" />
    <meta name="description" content="Sherifdeen Raji is a software developer building useful web products and APIs. Explore selected work and get in touch." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&display=swap" rel="stylesheet" />
    <script>
      try {
        const saved = localStorage.getItem('portfolio-theme');
        const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : system;
      } catch {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
    <title>Sherifdeen Raji — Software Developer</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
